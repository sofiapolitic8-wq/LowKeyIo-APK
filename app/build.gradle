plugins { id 'com.android.application' }
android {
    namespace 'io.lowkey.app'
    compileSdk 34
    defaultConfig {
        applicationId 'io.lowkey.app'
        minSdk 24
        targetSdk 34
        versionCode 972
        versionName '9.72'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // installable APK; use your own keystore for Play Store
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    androidResources { noCompress 'mp3','webp','jpg','png' }
}
